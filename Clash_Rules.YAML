port: 7890
socks-port: 7891
mixed-port: 7893
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 0.0.0.0:9090
tcp-concurrent: true
unified-delay: true

# 啟用 TCP Fast Open，降低建立連線的握手延遲
fast-open: true

# ==================== 設定檔快取 ====================
profile:
  store-selected: true
  store-fake-ip: true

# ==================== 流量嗅探器 Sniffer ====================
sniffer:
  enable: true
  override-destination: true
  sniff:
    QUIC:
      ports:
        - 443
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "+.apple.com"
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"
  parse-pure-ip: true
  force-dns-mapping: true

# ==================== 進階 DNS 設定 ====================
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: true  # 開啟：讓海外 DoH 安全地走代理，防止國內 DNS 污染
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.home.arpa'
    - 'captive.apple.com'
    - 'time.apple.com'
    - 'time.*.apple.com'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'ntp.*.com'
    # 讓國內網站與蘋果服務強制返回真實 IP（配合本地 GeoSite 屬性）
    - 'geosite:cn'
    - 'geosite:private'
    - 'geosite:apple'
  
  # 💥 1. 基礎 DNS：必須使用傳統實體 IP（不可改動）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8
    - 1.1.1.1

  # 💥 2. 節點專用 DNS（全部使用 IP 型 DoH，免除任何域名解析，極速啟動）
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://8.8.8.8/dns-query

  # 💥 3. 網域特殊分流（國內、蘋果、微信獨立優化）
  nameserver-policy:
    # 國內直連網站：使用阿里官方 IP 型 DoH + 騰訊官方域名 DoH（有 Anycast 優化）
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

    # 蘋果服務：中外頂級 IP 型 DoH 競爭解析
    "geosite:apple":
      - https://223.5.5.5/dns-query
      - https://8.8.8.8/dns-query

    # 微信/騰訊服務：在香港本地強制使用 Google/Cloudflare 實體 IP 型 DoH，以獲取香港本地極速 IP
    "geosite:weixin,tencent,qq":
      - https://8.8.8.8/dns-query
      - https://1.1.1.1/dns-query
      - https://doh.pub/dns-query

  # 💥 4. 國外網站兜底 DNS（推薦使用海外頂級 IP 型 DoH，自動走代理，防污染且速度最快）
  nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query

# ==================================================
# 代理節點設定
# ==================================================
proxies:

proxy-groups:
  - name: 🚀 節點選擇
    type: select
    proxies:
      - ⚡ 自動選擇
      - DIRECT

  - name: ⚡ 自動選擇
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:

  - name: 💬 AI 服務
    type: select
    proxies:
      - ⚡ 自動選擇
      - 🚀 節點選擇

  - name: 🍎 蘋果服務
    type: select
    proxies:
      - DIRECT
      - 🚀 節點選擇

  - name: Ⓜ️ 微軟服務
    type: select
    proxies:
      - DIRECT
      - 🚀 節點選擇

  - name: 🎮 遊戲平台
    type: select
    proxies:
      - DIRECT
      - 🚀 節點選擇

  - name: 🌐 非中國
    type: select
    proxies:
      - 🚀 節點選擇
      - DIRECT

  - name: 🇨🇳 國內服務
    type: select
    proxies:
      - DIRECT
      - 🚀 節點選擇

  - name: 🏠 私有網絡
    type: select
    proxies:
      - DIRECT

  - name: 🐟 漏網之魚
    type: select
    proxies:
      - 🚀 節點選擇
      - DIRECT

  - name: 🛑 廣告攔截
    type: select
    proxies:
      - REJECT
      - DIRECT

# ==================================================
# 規則集 Rule Providers (僅保留您的專屬 AI 遠端規則集)
# ==================================================
rule-providers:
  my-ai:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/sammy0101/myself/refs/heads/main/geosite_ai_hk_proxy.mrs"
    path: ./ruleset/my-ai.mrs
    interval: 86400

# ==================================================
# 流量路由 Rules
# ==================================================
rules:
  # 1. 廣告與內網
  - GEOSITE,category-ads-all,🛑 廣告攔截
  - GEOSITE,private,🏠 私有網絡
  - GEOIP,private,🏠 私有網絡,no-resolve

  # 2. 強制代理業務 (💥 已恢復使用您的專屬 AI 規則集)
  - RULE-SET,my-ai,💬 AI 服務

  # 3. Microsoft 服務分流
  - GEOSITE,microsoft,Ⓜ️ 微軟服務

  # 4. 遊戲平台分流
  - GEOSITE,steam,🎮 遊戲平台
  - GEOSITE,epicgames,🎮 遊戲平台
  - GEOSITE,ea,🎮 遊戲平台
  - GEOSITE,ubisoft,🎮 遊戲平台
  - GEOSITE,blizzard,🎮 遊戲平台

  # 5. Apple 服務分流
  - GEOSITE,apple,🍎 蘋果服務

  # 6. 非中國網站：走代理
  - GEOSITE,geolocation-!cn,🌐 非中國

  # 7. 中國國內網域與 IP：走直連
  - GEOSITE,cn,🇨🇳 國內服務
  - GEOIP,cn,🇨🇳 國內服務,no-resolve

  # 8. 國外網站兜底：全走代理
  - MATCH,🐟 漏網之魚
