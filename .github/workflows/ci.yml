name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Install Mihomo
        env:
          MIHOMO_VERSION: v1.19.30
          MIHOMO_SHA256: db214c7a2517e63c150d123178d16d102e03a241ccdae4e5e07ffbe9cf56c6f9
          GEOIP_COMMIT: 2239c0a2a4ced2ffb4a46b27a91c4dae97b06ccc
          GEOIP_SHA256: 516a12201e13e8e2f38fbec799b5e9d2e3c16c9f25884764424b0c04d7ff6ed9
        run: |
          archive="${RUNNER_TEMP}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
          geoip_archive="${RUNNER_TEMP}/geoip-lite.metadb"
          bin_dir="${RUNNER_TEMP}/mihomo-bin"
          geoip_dir="${HOME}/.config/mihomo"
          mkdir -p "${bin_dir}" "${geoip_dir}"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "${archive}" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "${geoip_archive}" \
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/${GEOIP_COMMIT}/geoip-lite.metadb"
          echo "${MIHOMO_SHA256}  ${archive}" | sha256sum --check -
          echo "${GEOIP_SHA256}  ${geoip_archive}" | sha256sum --check -
          gzip --decompress --stdout "${archive}" > "${bin_dir}/mihomo"
          install -m 0644 "${geoip_archive}" "${geoip_dir}/geoip.metadb"
          chmod +x "${bin_dir}/mihomo"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Verify Mihomo
        run: mihomo -v

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Audit dependencies
        run: bun audit

      - name: Validate Worker bundle
        run: bunx wrangler deploy --dry-run
